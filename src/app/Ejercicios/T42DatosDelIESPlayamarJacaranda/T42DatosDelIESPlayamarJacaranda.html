<!DOCTYPE html>
<html>
  <head>
    <title>T 4.2 Datos del IES Playamar / Jacaranda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>

  <body class = "container pt-2">

    <h2>T 4.2 Datos del IES Playamar / Jacaranda</h2>
    <hr>
    <h2>DATOS DE CENTROS EDUCATIVOS</h2>
    <dl>
      <td>Centro Educativo:</td>
      <dd>{{centroEducativo}}</dd>

      <td>Localidad:</td>
      <dd>{{Localidad}}</dd>

      <td>Familias Profesionales:</td>
      <dd>{{familiaProfecional}}</dd>

      <td>CENTRO:</td>
      <dd>{{centro}}</dd>

      <td>Logo:</td>
      <dd><img [src]="logo" width="200"></dd>
    </dl>

    <button (click)="cambiarCentro()">
      Cambiar centro
    </button>

  </body>
</html>
